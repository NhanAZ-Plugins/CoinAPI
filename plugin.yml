name: CoinAPI
main: Coin\Main
version: 2.0.0
api: 5.0.0
commands:
  mycoin:
    description: Hiển thị số coin của bạn
    permission: coinapi.command.mycoin
  seecoin:
    description: Hiển thị số coin của người chơi đang trực tuyến
    permission: coinapi.command.seecoin
  paycoin:
    description: Chuyển coin cho người chơi đang trực tuyến
    permission: coinapi.command.paycoin
  topcoin:
    description: Hiển thị bảng xếp hạng coin
    permission: coinapi.command.topcoin
  setcoin:
    permission: setcoin.cmd
    description: Đặt số coin của người chơi
  givecoin:
    permission: givecoin.cmd
    description: Cộng coin cho người chơi
  takecoin:
    permission: takecoin.cmd
    description: Trừ coin của người chơi
  helpcoin:
    description: Hiển thị hướng dẫn CoinAPI
    permission: coinapi.command.helpcoin
permissions:
  coinapi.command.mycoin:
    default: true
    description: Allows viewing your coin balance
  coinapi.command.seecoin:
    default: true
    description: Allows viewing an online player's coin balance
  coinapi.command.paycoin:
    default: true
    description: Allows transferring coins to an online player
  coinapi.command.topcoin:
    default: true
    description: Allows viewing the coin leaderboard
  setcoin.cmd:
    default: op
    description: Allows setting a player's coin balance
  givecoin.cmd:
    default: op
    description: Allows adding coins to a player's balance
  takecoin.cmd:
    default: op
    description: Allows removing coins from a player's balance
  coinapi.command.helpcoin:
    default: true
    description: Allows viewing CoinAPI command help
